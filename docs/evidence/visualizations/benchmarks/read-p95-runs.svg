<text x="40" y="440" font-size="14" font-weight="600" fill="#D55E00">Not a like-for-like comparison.</text>
<text x="40" y="460" font-size="13" fill="#1f2328">The machine blocks match on cpus, cpuModel, memoryGb, node and PostgreSQL 16.15, but each bar</text>
<text x="40" y="480" font-size="13" fill="#1f2328">is ONE run on a shared machine with other work on it, the commits differ (the code changed</text>
<text x="40" y="500" font-size="13" fill="#1f2328">between them) and the data differs slightly (27,412 vs 27,409 deadline items). No run-to-run</text>
<text x="40" y="520" font-size="13" fill="#1f2328">variance was measured, so a difference of this size cannot be called a regression or an</text>
<text x="40" y="540" font-size="13" fill="#1f2328">improvement.</text>
