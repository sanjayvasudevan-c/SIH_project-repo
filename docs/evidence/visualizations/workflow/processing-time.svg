<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t-workflow-processing-time d-workflow-processing-time" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t-workflow-processing-time">Median working days from submission to decision</title>
<desc id="d-workflow-processing-time">Median working days from submission to decision. Decided applications only. In-flight applications are not finished, so their time is not yet known.</desc>
