# Runs on pushes to main and on every pull request, plus a daily schedule so a bug that only
# appears when the calendar moves on (as the seed date bug did) is caught without a push.
# Everything runs against a throwaway PostgreSQL service container with the local dev
# passwords already committed in db/init/00_roles.sql and .env.example. No secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # event_name is in the key so a push can never cancel the daily scheduled run
  # (the defence against the next date-dependent bug) or a manual dispatch.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: API typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace api run prisma:generate
      - run: npm --workspace api run typecheck

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prints a chunk-size warning (about 919 kB); that is a warning, not a failure.
      - run: npm --workspace web run test
      - run: npm --workspace web run build

  api-tests:
    name: API tests (integration, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record the commit under test
        run: |
          mkdir -p api/test-results
          echo "$GITHUB_SHA" | tee api/test-results/commit.txt
          echo "Commit tested: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm --workspace api run prisma:generate
      # Creates aicte_migrator, aicte_app and the aicte / aicte_seed databases.
      # The suite builds its own aicte_test template in vitest globalSetup, so no seed step is needed.
      - name: Create roles and databases
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f db/init/00_roles.sql
      # The JUnit file is machine-readable output; the exit code still decides pass or fail.
      - name: API tests
        run: npm --workspace api run test -- --reporter=default --reporter=junit --outputFile.junit=test-results/api-junit.xml
      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/test-results/
          if-no-files-found: warn

  formcheck-tests:
    name: Form-check tests and ML evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: formcheck/requirements.txt
      - run: pip install -r formcheck/requirements.txt
      # formcheck/data/ and the .joblib model are gitignored, so they are regenerated here.
      # Generation and training are seeded and deterministic.
      - name: Generate synthetic data and train the model
        run: |
          cd formcheck
          python3 -m training.generate
          python3 -m training.train
      - name: Form-check tests
        run: |
          mkdir -p formcheck/test-results
          cd formcheck && python3 -m pytest -q --junitxml=test-results/formcheck-junit.xml
      # Fails if the committed evaluation no longer matches what the code produces.
      # A reproducibility check, not a test: it assumes bit-identical floating
      # point across CPUs and BLAS builds, so a last-digit drift must not turn
      # the job red when pytest passed.
      - name: ML evaluation is reproducible
        continue-on-error: true
        run: |
          (cd formcheck && python3 -m training.evaluate)
          if ! git diff --exit-code formcheck/EVALUATION.md formcheck/metrics.json; then
            {
              echo "### ML evaluation drifted from the committed files"
              echo "The retrained model on this runner produced a different evaluation. Not fatal (see the comment above); review before trusting last-digit differences."
              echo '```diff'
              git diff formcheck/EVALUATION.md formcheck/metrics.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload form-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formcheck-test-results
          path: formcheck/test-results/
          if-no-files-found: warn

  evidence-scripts:
    name: Chart generator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The glob matters: `node --test scripts/` runs nothing on Node 22.
      - run: node --test scripts/*.test.mjs
